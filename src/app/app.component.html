<div class="container"><h1>🛒 Tech Store</h1><p [class.error]="error" [class.success]="!error&&message">{{message}}</p><h2>Productos</h2><div class="grid"><div class="card" *ngFor="let p of products"><h3>{{p.name}}</h3><p>{{p.category}}</p><p>Precio: <strong>S/ {{p.price|number:'1.2-2'}}</strong></p><p>Stock: <strong>{{p.stock}}</strong></p><input type="number" min="1" [max]="p.stock" [(ngModel)]="quantities[p.id]"><button (click)="buy(p)" [disabled]="p.stock<1">Comprar</button></div></div><h2>Ventas</h2><div class="card" *ngFor="let s of sales">#{{s.id}} — {{s.productName}} — {{s.quantity}} unidad(es) — S/ {{s.unitPrice*s.quantity|number:'1.2-2'}}</div></div>
