name: CI-CD-EKS-Helm

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

jobs:

  # ============================================================
  # 1. STATIC ANALYSIS
  # ============================================================

  static-analysis:
    name: "1. Static Analysis"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build web-app
        run: |
          npm install
          npm run build

      # - name: SonarQube Scan
      #   uses: SonarSource/sonarqube-scan-action@v8.2.1
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


  # ============================================================
  # 2. BUILD + TRIVY + ECR
  # ============================================================

  build-scan-push:
    name: "2-4. Docker + Trivy + ECR"

    runs-on: ubuntu-latest

    needs: static-analysis

    strategy:
      fail-fast: true

      matrix:
        include:
          - component: web-app
            context: .
            ecr_repository: web-app
            container: web-app

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repository }}:${GITHUB_SHA}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "Image:"
          echo "${IMAGE}"

      - name: Containerize
        run: |
          docker build \
            --pull \
            --tag "${IMAGE}" \
            "${{ matrix.context }}"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          vuln-type: os,library
          scanners: vuln
          trivy-config: trivy.yaml

      - name: Push image to ECR
        run: |
          docker push "${IMAGE}"


  # ============================================================
  # 3. HELM DEPLOY
  # ============================================================

  deploy:
    name: "5-7. Helm Deploy + Rolling Update"

    runs-on: ubuntu-latest

    needs: build-scan-push

    environment:
      name: lab

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      # --------------------------------------------------------
      # AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Helm
      # --------------------------------------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4

      # --------------------------------------------------------
      # Kubeconfig
      # --------------------------------------------------------

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      # --------------------------------------------------------
      # Verify AWS
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Verify Kubernetes
      # --------------------------------------------------------

      - name: Verify Kubernetes access
        run: |
          kubectl get namespace "${K8S_NAMESPACE}"

      # --------------------------------------------------------
      # Helm lint
      # --------------------------------------------------------

      - name: Helm lint
        run: |
          helm lint ./helm/web-app

      # --------------------------------------------------------
      # Helm template
      # --------------------------------------------------------

      - name: Helm template
        run: |
          helm template web-app \
            ./helm/web-app \
            --namespace "${K8S_NAMESPACE}" \
            --set image.tag="${GITHUB_SHA}"

      # --------------------------------------------------------
      # Helm deploy
      # --------------------------------------------------------

      - name: Helm upgrade
        run: |
          helm upgrade --install web-app \
            ./helm/web-app \
            --namespace "${K8S_NAMESPACE}" \
            --set image.tag="${GITHUB_SHA}" \
            --wait \
            --timeout 5m

      # --------------------------------------------------------
      # Rollout status
      # --------------------------------------------------------

      - name: Wait for web rollout
        run: |
          kubectl rollout status \
            deployment/web-app \
            -n "${K8S_NAMESPACE}" \
            --timeout=180s

      # --------------------------------------------------------
      # Deployment summary
      # --------------------------------------------------------

      - name: Deployment summary
        run: |

          echo "=== Helm Releases ==="

          helm list \
            -n "${K8S_NAMESPACE}"

          echo ""
          echo "=== Deployments ==="

          kubectl get deployments \
            -n "${K8S_NAMESPACE}" \
            -o wide

          echo ""
          echo "=== Pods ==="

          kubectl get pods \
            -n "${K8S_NAMESPACE}" \
            -o wide

          echo ""
          echo "=== Services ==="

          kubectl get services \
            -n "${K8S_NAMESPACE}"

          echo ""
          echo "=== Ingress ==="

          kubectl get ingress \
            -n "${K8S_NAMESPACE}"